<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f6f8fa">
  <meta name="description" content="GarantiTakip: kişisel ürün, garanti ve servis yönetim paneli (Google Drive ve Firebase ile)">
  <title>GarantiTakip | Ürün ve Garanti Yönetimi</title>
  <link rel="stylesheet" href="app.css?v=8_3">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" aria-label="Ana menü">
      <div class="brand">
        <span class="brand-symbol" aria-hidden="true"><svg viewBox="0 0 32 32" fill="none"><path d="M16 3.5 27 8v8.1c0 6.4-4.2 10.4-11 12.6C9.2 26.5 5 22.5 5 16.1V8L16 3.5Z" stroke="currentColor" stroke-width="2"/><path d="m11.5 16 3.2 3.1 6.1-6.6" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
        <span><strong>GarantiTakip</strong><small>Kişisel arşiv & takip</small></span>
      </div>
      <div class="side-label">ÇALIŞMA ALANI</div>
      <nav class="nav" id="sideNav"></nav>
      <div class="sidebar-spacer"></div>
      <div class="side-divider"></div>
      <div class="mode-card"><span class="mode-dot"></span><div><strong>Bulut uygulaması</strong><small>Google ile giriş gerekli</small></div></div>
      <div class="profile"><div class="avatar">GT</div><div><strong>Kişisel hesap</strong><small>Kişisel bulut hesabı</small></div><span class="chevron">⌄</span></div>
    </aside>
    <div class="workspace">
      <header class="topbar">
        <div class="topbar-mobile-brand"><span class="mini-logo">✓</span> GarantiTakip</div>
        <div class="breadcrumbs" id="breadcrumbs">Genel Bakış</div>
        <div class="top-actions">
          <span class="prototype-chip"><span></span> Bulut sürümü</span>
          <button class="icon-btn" id="headerNotifications" aria-label="Hatırlatmaları aç" title="Hatırlatmalar"><span data-icon="bell"></span><i id="notificationDot"></i></button>
          <button class="icon-btn" id="headerSettings" aria-label="Ayarları aç" title="Ayarlar"><span data-icon="settings"></span></button>
          <div class="avatar avatar-small" title="Tek kullanıcı">GT</div>
        </div>
      </header>
      <main id="main" tabindex="-1"></main>
    </div>
    <nav class="bottom-nav" id="bottomNav" aria-label="Mobil gezinme"></nav>
  </div>
  <div id="authGate" class="auth-overlay"><div class="auth-card"><h1>GarantiTakip</h1><p>Bağlantı hazırlanıyor…</p></div></div>
  <div id="modalLayer"></div>
  <div id="toastLayer" class="toast-layer" aria-live="polite"></div>
  <script>
    // Faz 8.3 - acilis teshis. Firebase ve Drive verileri etkilenmez.
    window.__GT_BOOT_DONE__ = false;
    const gtVersion = '8.3';
    const gtFailLog = [];
    function gtCleanSource(url) {
      try {
        const u = new URL(url, location.href);
        return u.origin === location.origin ? u.pathname.split('/').pop() : u.hostname + u.pathname;
      } catch { return String(url || 'bilinmiyor'); }
    }
    function gtExplainProblem(message) {
      const gate = document.getElementById('authGate');
      if (!gate || gate.hidden || window.__GT_BOOT_DONE__) return;
      const errorText = String(message || 'Bilinmeyen JavaScript hatasi').slice(0,900);
      if (gtFailLog.includes(errorText)) return;
      gtFailLog.push(errorText);
      const card = document.createElement('div');
      card.className = 'auth-card';
      const heading = document.createElement('h1');
      heading.textContent = 'GarantiTakip';
      const lead = document.createElement('p');
      lead.textContent = 'Uygulama acilisinda hata tespit edildi. Firebase verileriniz bu nedenle silinmis degildir.';
      const detail = document.createElement('pre');
      detail.textContent = errorText;
      detail.style.cssText = 'text-align:left;white-space:pre-wrap;overflow-wrap:anywhere;padding:12px;background:#fff7ed;border-radius:8px;color:#9a3412;max-height:180px;overflow:auto;';
      const foot = document.createElement('small');
      foot.textContent = 'Teshis surumu: ' + gtVersion + ' | Hata metnini kopyalayarak paylasabilirsiniz.';
      const button = document.createElement('button');
      button.type = 'button';
      button.textContent = 'Hata bilgisini kopyala';
      button.style.cssText = 'padding:10px 14px;margin-top:10px;cursor:pointer;';
      button.addEventListener('click', async () => {
        const report = gtFailLog.join('\n---\n');
        try { await navigator.clipboard.writeText(report); button.textContent = 'Kopyalandi'; }
        catch { button.textContent = 'Yukaridaki hata metnini secerek kopyalayin'; }
      });
      card.append(heading, lead, detail, foot, button);
      gate.replaceChildren(card);
    }
    window.addEventListener('error', e => {
      if (e.target && e.target !== window) {
        const resource = e.target.src || e.target.href;
        if (resource) gtExplainProblem('Kaynak yuklenemedi: ' + gtCleanSource(resource));
        return;
      }
      const locationInfo = e.filename
        ? '\nDosya: ' + gtCleanSource(e.filename) + '\nSatir: ' + (e.lineno || '?') + ' / Sutun: ' + (e.colno || '?')
        : '\nDosya bilgisi tarayici tarafindan saglanmadi.';
      gtExplainProblem((e.message || e.error?.message || 'JavaScript hatasi') + locationInfo);
    }, true);
    window.addEventListener('unhandledrejection', e => {
      gtExplainProblem('Modul/Promise hatasi: ' + (e.reason?.stack || e.reason?.message || String(e.reason)));
    });
    setTimeout(async () => {
      const gate = document.getElementById('authGate');
      if (window.__GT_BOOT_DONE__ || !gate || gate.hidden || gtFailLog.length) return;
      const files = ['bootstrap.js','app.js','cloud.js','drive.js','integrity.js','filename.js','document-delete.mjs','invoice.mjs','reports.mjs','notification-feed.mjs'];
      const bad = [];
      await Promise.all(files.map(async name => {
        try {
          const response = await fetch(name + '?probe=8_3', {cache:'no-store'});
          if (!response.ok) bad.push(name + ' HTTP ' + response.status);
          else if ((response.headers.get('content-type') || '').includes('text/html')) bad.push(name + ' JavaScript yerine HTML donuyor');
        } catch { bad.push(name + ' erisilemiyor'); }
      }));
      gtExplainProblem(bad.length ? 'Eksik/gecersiz moduller: ' + bad.join(', ') :
        'Dosyalar sunucudan yanit veriyor; modul baslatilamadi. F12 > Console ilk kirmizi hatayi ve dosya adresini paylasin.');
    }, 12000);
  </script>
  <script src="config.js?v=8_3"></script>
  <script type="module" src="bootstrap.js?v=8_3"></script>
</body>
</html>
