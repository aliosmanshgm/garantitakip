<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f6f8fa">
  <meta name="description" content="GarantiTakip: kişisel ürün, garanti ve servis yönetim paneli (Google Drive ve Firebase ile)">
  <title>GarantiTakip | Ürün ve Garanti Yönetimi</title>
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" aria-label="Ana menü">
      <div class="brand">
        <span class="brand-symbol" aria-hidden="true"><svg viewBox="0 0 32 32" fill="none"><path d="M16 3.5 27 8v8.1c0 6.4-4.2 10.4-11 12.6C9.2 26.5 5 22.5 5 16.1V8L16 3.5Z" stroke="currentColor" stroke-width="2"/><path d="m11.5 16 3.2 3.1 6.1-6.6" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
        <span><strong>GarantiTakip</strong><small>Kişisel arşiv & takip</small></span>
      </div>
      <div class="side-label">ÇALIŞMA ALANI</div>
      <nav class="nav" id="sideNav"></nav>
      <div class="sidebar-spacer"></div>
      <div class="side-divider"></div>
      <div class="mode-card"><span class="mode-dot"></span><div><strong>Bulut uygulaması</strong><small>Google ile giriş gerekli</small></div></div>
      <div class="profile"><div class="avatar">GT</div><div><strong>Kişisel hesap</strong><small>Kişisel bulut hesabı</small></div><span class="chevron">⌄</span></div>
    </aside>
    <div class="workspace">
      <header class="topbar">
        <div class="topbar-mobile-brand"><span class="mini-logo">✓</span> GarantiTakip</div>
        <div class="breadcrumbs" id="breadcrumbs">Genel Bakış</div>
        <div class="top-actions">
          <span class="prototype-chip"><span></span> Bulut sürümü</span>
          <button class="icon-btn" id="headerNotifications" aria-label="Hatırlatmaları aç" title="Hatırlatmalar"><span data-icon="bell"></span><i id="notificationDot"></i></button>
          <button class="icon-btn" id="headerSettings" aria-label="Ayarları aç" title="Ayarlar"><span data-icon="settings"></span></button>
          <div class="avatar avatar-small" title="Tek kullanıcı">GT</div>
        </div>
      </header>
      <main id="main" tabindex="-1"></main>
    </div>
    <nav class="bottom-nav" id="bottomNav" aria-label="Mobil gezinme"></nav>
  </div>
  <div id="authGate" class="auth-overlay"><div class="auth-card"><h1>GarantiTakip</h1><p>Bağlantı hazırlanıyor…</p></div></div>
  <div id="modalLayer"></div>
  <div id="toastLayer" class="toast-layer" aria-live="polite"></div>
  <script>
    /* Acilis hatasi - statik betik; ES modulleri yuklenemese de calisir. */
    window.__GT_BOOT_DONE__ = false;
    function gtDisplayEarlyError(message) {
      const gate = document.getElementById('authGate');
      if (!gate || gate.hidden || !gate.textContent.includes('Bağlantı hazırlanıyor')) return;
      const box = document.createElement('div');
      box.className = 'auth-card';
      const heading = document.createElement('h1');
      heading.textContent = 'GarantiTakip';
      const body = document.createElement('p');
      body.textContent = 'Uygulama açılışında hata oluştu. Firebase kayıtlarınız bu nedenle silinmiş değildir.';
      const detail = document.createElement('small');
      detail.style.cssText = 'display:block;overflow-wrap:anywhere;color:#b45309';
      detail.textContent = String(message).slice(0,500);
      box.append(heading,body,detail);
      gate.replaceChildren(box);
    }
    window.addEventListener('error', event => {
      if (event.target && event.target !== window) {
        const src = event.target.src || event.target.href;
        if (src) gtDisplayEarlyError('Kaynak yüklenemedi: ' + src);
      } else if (event.message) {
        gtDisplayEarlyError(event.message);
      }
    }, true);
    window.addEventListener('unhandledrejection', event => {
      gtDisplayEarlyError(event.reason?.message || 'JavaScript modülü çalıştırılamadı.');
    });
    setTimeout(async () => {
      const gate = document.getElementById('authGate');
      if (window.__GT_BOOT_DONE__ || !gate || gate.hidden || !gate.textContent.includes('Bağlantı hazırlanıyor')) return;
      const names = ['bootstrap.js','app.js','cloud.js','drive.js','integrity.js','filename.js','document-delete.mjs','invoice.mjs','reports.mjs','notification-feed.mjs'];
      const problems = [];
      await Promise.all(names.map(async file => {
        try {
          const response = await fetch(file, { method:'HEAD', cache:'no-store' });
          if (!response.ok) problems.push(file + ': HTTP ' + response.status);
        } catch { problems.push(file + ': erişilemiyor'); }
      }));
      gtDisplayEarlyError(problems.length
        ? 'Eksik/erişilemeyen dosyalar: ' + problems.join(', ')
        : 'Dosyalar erişilebilir, ancak JavaScript başlatılamadı. Tarayıcı geliştirici araçları > Console bölümündeki ilk kırmızı hatayı kontrol edin.');
    }, 12000);
  </script>
  <script src="config.js"></script>
  <script type="module" src="bootstrap.js"></script>
</body>
</html>
